<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="t">
  <title id="t">agent-plane mark: a proposed action passing through a governed gate between two planes</title>
  <!-- Drawn on a 24-unit grid, not scaled down from a fine one: this is read
       at 22px in the console header, where a hairline disappears and two thin
       bars merge into one blob. One bar, and nothing thinner than 1.5px at
       that size. Ink at two weights rather than a brand colour, since the
       console reserves colour for state. -->
  <g fill="#11110F">
    <polygon points="2.5,3 9,7 9,17 2.5,21" fill-opacity="0.16"/>
    <polygon points="21.5,3 15,7 15,17 21.5,21" fill-opacity="0.32"/>
  </g>
  <g fill="#11110F">
    <rect x="1" y="11.1" width="17.5" height="1.8"/>
    <polygon points="17.5,9.2 23,12 17.5,14.8"/>
    <!-- The gate, drawn last so it reads as the thing being passed. -->
    <rect x="11" y="4.5" width="2" height="15"/>
  </g>
</svg>
