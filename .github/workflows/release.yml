name: Release

# Matching v<version> tags publish only after required checks pass.
# Manual dispatch builds reviewable artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate runtime, SDK, and tag versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            python examples/check_release_version.py --tag "$RELEASE_TAG"
          else
            python examples/check_release_version.py
          fi

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    strategy:
      fail-fast: false
      matrix:
        package: [server, sdk]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-distributions
          path: dist
      - name: Publish exact tested packages
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/

  publish-container:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-container
          path: artifacts
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        shell: bash
        run: |
          docker load --input artifacts/image.tar
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          docker tag agent-plane:ci "$image"
          docker push "$image"
