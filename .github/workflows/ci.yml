name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational, never blocks a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6   # pinned: an unpinned lint is a non-reproducible one
      - run: ruff check .

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # surfaces dependency CVEs; review, don't auto-block
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[all]"
          # --skip-editable, and no --strict: agent-plane installs editable and is
          # not on PyPI, so --strict turned "cannot audit the project itself" into a
          # job failure on every single run. Real dependency vulnerabilities still
          # fail this step; they just used to be indistinguishable from that noise.
          pip-audit --skip-editable
