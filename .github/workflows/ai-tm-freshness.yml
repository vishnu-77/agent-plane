name: AI-TM freshness

# No path filter: this is a required status check (see the "branch protect"
# ruleset). A path-filtered required check that doesn't run on a given PR
# reports nothing at all - GitHub then blocks the merge forever waiting for a
# status that will never arrive, instead of treating it as satisfied. The
# job itself is two small YAML reads, so running it unconditionally is cheap.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  threat-model-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Fail if the threat model has drifted from the capability manifest
        run: >-
          python -m agent_plane.authority_cli check-freshness
          --capabilities config/capability-manifest.yaml
          --threat-model config/threat-model.yaml
