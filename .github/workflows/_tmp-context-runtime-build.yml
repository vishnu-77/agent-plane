name: Temporary context runtime validation

on:
  push:
    branches:
      - "feat/context-registry-runtime"
    paths:
      - ".github/workflows/_tmp-context-runtime-build.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-registry-runtime
      - name: Keep context persistence off the ordinary cold-start path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("agent_plane/context/store.py")
          s = p.read_text()
          old = '''    def __init__(self, db_url: str) -> None:\n        self._engine = create_sql_engine(db_url)\n        Base.metadata.create_all(self._engine)\n        self._session_factory = sessionmaker(bind=self._engine, class_=Session)\n        self._lock = threading.RLock()\n'''
          new = '''    def __init__(self, db_url: str) -> None:\n        self._engine = create_sql_engine(db_url)\n        self._session_factory = sessionmaker(bind=self._engine, class_=Session)\n        self._lock = threading.RLock()\n        self._schema_ready = False\n\n    def _ensure_schema(self) -> None:\n        if self._schema_ready:\n            return\n        with self._lock:\n            if not self._schema_ready:\n                Base.metadata.create_all(self._engine)\n                self._schema_ready = True\n\n    def _session(self) -> Session:\n        self._ensure_schema()\n        return self._session_factory()\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          assert s.count("with self._lock, self._session_factory() as session:") == 1
          s = s.replace("with self._lock, self._session_factory() as session:",
                        "with self._lock, self._session() as session:", 1)
          count = s.count("with self._session_factory() as session:")
          assert count == 5, count
          s = s.replace("with self._session_factory() as session:", "with self._session() as session:")
          p.write_text(s)
          PY
      - name: Add memory governance to the normal action vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ("config/resources.yaml", "agent_plane/defaults/config/resources.yaml"):
              p = Path(filename)
              s = p.read_text()
              marker = '''actions:\n  - pattern: "*.read"\n'''
              resource = '''  - pattern: "memory://*"\n    environment: memory\n    criticality: medium\n    customer_facing: false\n    reversibility: recoverable\n    persistence: durable\n    description: persistent agent memory\n    business: cross-session context that can influence future actions\n\nactions:\n  - pattern: "*.read"\n'''
              assert s.count(marker) == 1, filename
              s = s.replace(marker, resource, 1)
              marker = '''  - pattern: "*.list"\n    effect: list\n'''
              actions = '''  - pattern: "*.list"\n    effect: list\n  - pattern: "memory.read"\n    effect: read\n    label: Read agent memory\n    consequence:\n      class: persistent_context_read\n      scope: memory_record\n      reversible: true\n    direct_effect: "persistent context enters the agent's current context"\n  - pattern: "memory.write"\n    effect: mutate\n    severity: medium\n    label: Write agent memory\n    reversibility: recoverable\n    persistence: durable\n    consequence:\n      class: persistent_context_change\n      scope: memory_record\n      reversible: true\n    direct_effect: "new persistent context may influence future sessions"\n'''
              assert s.count(marker) == 1, filename
              p.write_text(s.replace(marker, actions, 1))

          p = Path("agent_plane/gateway/accounts_router.py")
          s = p.read_text()
          old = '''_ACTION_NAMESPACE_ORDER = ["filesystem", "tests", "git", "repository", "shell",\n                           "package", "branch", "network"]\n'''
          new = '''_ACTION_NAMESPACE_ORDER = ["filesystem", "tests", "git", "repository", "shell",\n                           "package", "branch", "network", "memory"]\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
          pip install -e ./sdk/python
      - name: Run Python tests
        run: python -m pytest -q
      - name: Verify committed OpenAPI remains current
        run: python examples/export_openapi.py --check
      - name: Lint Python
        run: |
          pip install ruff==0.16.6
          ruff check agent_plane tests
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build console and verify committed bundle
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          git diff --stat --exit-code -- ../agent_plane/console/dist
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_plane/context/store.py agent_plane/gateway/accounts_router.py agent_plane/defaults/config/resources.yaml config/resources.yaml
          git commit -m "perf: keep context persistence off cold start" || exit 0
          git push origin HEAD:feat/context-registry-runtime
