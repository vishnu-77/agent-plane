name: Temporary context-action console build

on:
  push:
    branches:
      - "feat/context-action-plane"
    paths:
      - ".github/workflows/_tmp-context-action-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-action-plane
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build console
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_plane/console/dist
          git commit -m "build(console): refresh context-action bundle" || exit 0
          git push origin HEAD:feat/context-action-plane
