# Resource and action catalog (config-driven). This is what turns an action
# into a *consequence*: the same verb against a sandbox, a staging workload,
# or a customer-facing production service produces radically different effects.
#
# Every AuthorityLease can bound consequences (see `permitted_consequence`),
# and every decision explains which profile each dimension came from.
#
# Resource patterns are globs over the canonical resource string; the most
# specific (longest) match wins. `dependents` are resources that break or
# change downstream if this one changes; `depends_on` is the inverse edge.
resources:
  - pattern: "staging/*"
    environment: staging
    criticality: low
    customer_facing: false
    reversibility: reversible
    persistence: transient
    description: staging workloads
    business: pre-production verification

  - pattern: "staging/checkout"
    environment: staging
    criticality: low
    customer_facing: false
    reversibility: reversible
    persistence: transient
    dependents: ["staging/orders"]
    description: staging checkout service

  - pattern: "staging/orders"
    environment: staging
    criticality: low
    description: staging order pipeline

  - pattern: "production/*"
    environment: production
    criticality: critical
    customer_facing: true
    reversibility: recoverable
    persistence: durable
    description: production workloads
    business: live customer traffic

  - pattern: "production/checkout"
    environment: production
    criticality: critical
    customer_facing: true
    reversibility: recoverable
    persistence: durable
    dependents: ["production/orders", "production/payments"]
    description: production checkout service
    business: every purchase flows through this service

  - pattern: "production/payments"
    environment: production
    criticality: critical
    customer_facing: true
    reversibility: irreversible
    persistence: permanent
    description: payment capture
    business: money movement; chargebacks are not reversible

  - pattern: "production/orders"
    environment: production
    criticality: high
    customer_facing: true
    description: order pipeline

  - pattern: "github://*/branches/main"
    environment: source
    criticality: critical
    reversibility: recoverable
    persistence: durable
    protected: true
    dependents: ["ci://*", "production/*"]
    description: default branch
    business: CI/CD and every deployment derive from it

  - pattern: "github://*/branches/*"
    environment: source
    criticality: low
    reversibility: recoverable
    persistence: durable
    description: feature or stale branch

  - pattern: "github://*"
    environment: source
    criticality: medium
    description: repository

  - pattern: "ci://*"
    environment: ci
    criticality: high
    description: continuous integration pipelines

  - pattern: "tickets/*"
    environment: support
    criticality: medium
    customer_facing: false
    description: support tickets (contain customer PII)

  - pattern: "customers/*"
    environment: data
    criticality: critical
    customer_facing: true
    reversibility: irreversible
    persistence: permanent
    description: customer records
    business: regulated personal data

  - pattern: "email/*"
    environment: external
    criticality: high
    customer_facing: true
    reversibility: irreversible
    persistence: permanent
    description: outbound email
    business: cannot be unsent

  # --- coding agents: the workspace an agent edits, and what it can reach ---
  - pattern: "workspace/*"
    environment: workspace
    criticality: low
    reversibility: reversible
    persistence: durable
    description: files in the current working tree
    business: reviewable before it ever ships

  - pattern: "workspace/.env*"
    environment: workspace
    criticality: critical
    reversibility: irreversible
    persistence: permanent
    protected: true
    description: local secrets
    business: credentials must not leave the machine

  - pattern: "shell/*"
    environment: workspace
    criticality: medium
    reversibility: recoverable
    description: commands run on the developer machine or CI runner

  - pattern: "package/*"
    environment: workspace
    criticality: medium
    reversibility: recoverable
    dependents: ["workspace/*"]
    description: third-party dependencies
    business: a new dependency is new code you now run

  - pattern: "network/*"
    environment: external
    criticality: high
    customer_facing: false
    reversibility: irreversible
    persistence: permanent
    description: outbound network access

  - pattern: "credentials/*"
    environment: secrets
    criticality: critical
    reversibility: irreversible
    persistence: permanent
    protected: true
    description: credential stores
    business: reading one is equivalent to holding it

actions:
  - pattern: "*.read"
    effect: read
  - pattern: "*.list"
    effect: list
  - pattern: "logs.read"
    effect: read
    direct_effect: "reads log lines; no state change"
  - pattern: "metrics.read"
    effect: read
    direct_effect: "reads metrics; no state change"
  - pattern: "deployment.restart"
    effect: restart
    severity: medium
    direct_effect: "workload restarts; in-flight requests are dropped"
  - pattern: "deployment.delete"
    effect: delete
    severity: high
    reversibility: recoverable
    direct_effect: "workload is removed and stops serving"
  - pattern: "deployment.scale"
    effect: mutate
    severity: medium
    direct_effect: "replica count changes"
  - pattern: "branch.delete"
    effect: delete
    severity: medium
    reversibility: recoverable
    direct_effect: "branch ref is removed; commits stay reachable for a while"
  - pattern: "branch.write"
    effect: mutate
    severity: low
    direct_effect: "commits are pushed to the branch"
  - pattern: "customer.export"
    effect: export
    severity: high
    reversibility: irreversible
    direct_effect: "customer data leaves the system"
  - pattern: "email.send"
    effect: send
    severity: high
    reversibility: irreversible
    persistence: permanent
    direct_effect: "an email is delivered to an external recipient"

  # --- coding agents ---
  - pattern: "filesystem.read"
    effect: read
    label: Read files
    consequence:
      class: read_only
      scope: single_file
      reversible: true
    direct_effect: "reads a file; no state change"
  - pattern: "filesystem.write"
    effect: mutate
    label: Modify the workspace
    consequence:
      class: workspace_mutation
      scope: single_file
      reversible: true
    direct_effect: "writes a file in the working tree"
  - pattern: "filesystem.delete"
    effect: delete
    label: Delete files
    consequence:
      class: destructive_resource_change
      scope: single_file
      reversible: false
    direct_effect: "removes a file from the working tree"
  - pattern: "shell.execute"
    effect: execute
    label: Run commands
    consequence:
      class: code_execution
      scope: workspace
      reversible: true
    direct_effect: "runs a command with the developer's own privileges"
  - pattern: "tests.execute"
    effect: execute
    severity: low
    label: Run tests
    consequence:
      class: code_execution
      scope: workspace
      reversible: true
    direct_effect: "runs the test suite"
  - pattern: "git.commit"
    effect: mutate
    severity: low
    label: Commit changes
    consequence:
      class: repository_mutation
      scope: repository
      reversible: true
    direct_effect: "records a commit locally"
  - pattern: "git.push"
    effect: mutate
    severity: medium
    label: Push git changes
    consequence:
      class: repository_mutation
      scope: repository
      reversible: true
      environment_sensitive: true
    direct_effect: "publishes commits others and CI will build on"
  - pattern: "repository.delete"
    effect: delete
    severity: critical
    label: Delete repositories
    consequence:
      class: destructive_resource_change
      scope: repository
      reversible: false
    direct_effect: "removes the repository and its history"
  - pattern: "package.install"
    effect: create
    severity: medium
    label: Install packages
    consequence:
      class: dependency_change
      scope: workspace
      reversible: true
    direct_effect: "adds third-party code that will then execute"
  - pattern: "network.access"
    effect: send
    severity: medium
    label: Access external network
    consequence:
      class: external_communication
      scope: organisation
      reversible: false
    direct_effect: "contacts a host outside the workspace"
  - pattern: "credentials.read"
    effect: read
    severity: critical
    label: Access credentials
    consequence:
      class: credential_access
      scope: account
      reversible: false
    direct_effect: "reads a secret; holding it is the same as using it"
  - pattern: "config.write"
    effect: mutate
    severity: medium
    label: Change configuration
    consequence:
      class: configuration_change
      scope: single_service
      reversible: true
