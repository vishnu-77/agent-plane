# Opt-in infra profile: Postgres (audit) + Redis (cache/quota) + gateway.
# Local default needs none of this (SQLite + in-memory). Run with:
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentplane
      POSTGRES_PASSWORD: agentplane
      POSTGRES_DB: agentplane
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentplane"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STORAGE_BACKEND: postgres
      AUTHORITY_STORE: sql
      POSTGRES_URL: postgresql+psycopg://agentplane:agentplane@postgres:5432/agentplane
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: ${LOG_FORMAT:-text}
      APPROVAL_WEBHOOK_URL: ${APPROVAL_WEBHOOK_URL:-}
      MCP_GATEWAY_FILE: ${MCP_GATEWAY_FILE:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-dev-audit-key-change-me}
      # Accounts, API keys (ap_live_/ap_test_/ap_mgmt_), and console sessions.
      # Empty falls back to JWT_SECRET; set it to rotate keys independently.
      API_KEY_SECRET_VALUE: ${API_KEY_SECRET_VALUE:-}
      SIGNUP_MODE: ${SIGNUP_MODE:-first_user}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # Fallback mode for traffic that belongs to no project (a project's own
      # observe | govern | enforce mode always wins).
      ENFORCEMENT_MODE: ${ENFORCEMENT_MODE:-enforce}
      IDENTITY_MODE: ${IDENTITY_MODE:-jwt_claims}
      DELEGATION_PUBLIC_KEY: ${DELEGATION_PUBLIC_KEY:-}
      DELEGATION_SIGNING_KEY: ${DELEGATION_SIGNING_KEY:-}
      DELEGATION_ISSUER: ${DELEGATION_ISSUER:-}
      DELEGATION_AUDIENCE: ${DELEGATION_AUDIENCE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# Postgres holds audit evidence, leases, use counters, approvals, and the
# gateway request ledger, so `docker compose up --scale gateway=3` is safe.
volumes:
  postgres-data:
  redis-data:
