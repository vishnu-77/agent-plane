[project]
name = "agent-plane"
version = "0.2.0"
description = "Enterprise Agentic AI Control Plane - a deterministic, drop-in policy decision point for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Vishnu Prashanth Sridhar" }]
keywords = ["ai", "agents", "control-plane", "authorization", "llm", "gateway", "security"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Security",
]
# Minimal core: the zero-setup path (SQLite + in-memory + jwt_claims) runs on this
# alone. Heavy/optional capabilities are opt-in extras below.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
delegation = ["cryptography>=42"]        # Ed25519 verified identity (IDENTITY_MODE=delegation)
tokens = ["tiktoken>=0.7"]               # exact token counting (else a char heuristic)
postgres = ["psycopg[binary]>=3.2"]      # Postgres audit backend
redis = ["redis>=5.0"]                    # Redis cache/quota backend
server = ["uvicorn[standard]>=0.30"]     # uvloop/httptools + --reload
all = [
    "cryptography>=42",
    "tiktoken>=0.7",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "cryptography>=42",                   # so the full suite (delegation tests) runs
    "tiktoken>=0.7",
]

[project.scripts]
agentplane = "agent_plane.cli:main"

[project.urls]
Homepage = "https://github.com/vishnu-77/agent-plane"
Repository = "https://github.com/vishnu-77/agent-plane"
Issues = "https://github.com/vishnu-77/agent-plane/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_plane*"]

[tool.setuptools.package-data]
agent_plane = ["defaults/policies/*.yaml", "defaults/config/*.yaml", "console/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
