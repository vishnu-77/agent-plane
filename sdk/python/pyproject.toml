[project]
name = "agent-plane-sdk"
version = "0.3.0"
description = "Python client for agent-plane runtime task authorization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agent-plane contributors" }]
keywords = [
    "ai-agents", "agent-security", "runtime-security", "authorization",
    "access-control", "task-scoped-authority", "least-privilege", "python-sdk", "httpx",
]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/vishnu-77/agent-plane"
Issues = "https://github.com/vishnu-77/agent-plane/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentplane*"]
